[project]
name = "autonomous-grant-discovery"
version = "0.1.0"
description = "Tech On Hand Autonomous Grant Discovery Platform"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Core / schema
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-dateutil>=2.9",

    # Web / review app (module 12)
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",

    # Storage (module 16)
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",

    # Scheduling (module 16)
    "apscheduler>=3.10",

    # Crawling / ingestion (modules 04, 05)
    "httpx>=0.27",
    "crawl4ai>=0.4",
    "playwright>=1.45",

    # Attachment parsing (module 06)
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "python-docx>=1.1",

    # Prefilter / dates (module 07)
    "dateparser>=1.2",

    # Extraction (module 08) — LLM client for the Ollama host
    "ollama>=0.3",

    # Discovery (module 03)
    # Serper has no official SDK; called directly via httpx.

    # Delivery (module 14)
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Tier 2 browser agent (module 05) — heavier, optional install
tier2 = [
    "browser-use>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
